services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: baestargram
      POSTGRES_PASSWORD: baestargram
      POSTGRES_DB: baestargram
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baestargram -d baestargram"]
      interval: 5s
      timeout: 5s
      retries: 10
